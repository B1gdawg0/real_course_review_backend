services:
  # Using external PostgreSQL database (ku.milimm.net:5434)
  # db service is disabled - connecting to external database instead
  
  course-review-api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      N8N_BASE_URL: ${N8N_BASE_URL}
      RESET_DB: ${RESET_DB:-false}  # Set to "true" to drop and recreate all tables
    # No depends_on db since using external database